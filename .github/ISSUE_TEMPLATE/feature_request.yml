name: Feature request
description: Suggest a new command, option, or capability for the XBOX CLI.
type: feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you're trying to solve before jumping to a solution — that helps us evaluate whether a different approach might fit better.

        **Before you file**: please search [existing issues](https://github.com/microsoft/XBOX-Developer-CLI/issues?q=is%3Aissue) to see whether this has already been requested.

        Do not include credentials, account details, or other sensitive information.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing problem, scenario, or workflow that's currently painful.
      placeholder: When I'm doing X, I have to ... because the CLI doesn't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What command, option, or behavior would address the problem? Concrete syntax examples help.
      placeholder: |
        A new subcommand `xbox playfab <X>` that ...
        Or a new option `--foo` on `playfab api call` that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they don't quite fit.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links to PlayFab API docs, related issues, scripts you've built as a workaround.
    validations:
      required: false
